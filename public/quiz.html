<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Autism Symptom Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom right, #e0f7fa, #f0f8ff);
      font-family: 'Quicksand', sans-serif;
      padding: 20px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      background-color: #007acc;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .back-btn:hover {
      background-color: #005f99;
    }

    h1 {
      color: #004080;
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }

    form {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      max-width: 700px;
      margin: 0 auto;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      font-weight: bold;
      text-align: left;
      margin: 20px 0 8px;
      color: #004080;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus {
      border-color: #007acc;
      outline: none;
    }

    button {
      background-color: #007acc;
      color: white;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #005f99;
    }

    @media screen and (max-width: 768px) {
      form {
        padding: 20px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        font-size: 1rem;
      }
    }.guidance-btn {
  display: inline-block;
  background: #7ec8e3;
  color: #fff;
  padding: 14px 28px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 30px;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  transition: all 0.3s ease;
  animation: glow 2s infinite alternate;
}

.guidance-btn:hover {
  background: #00aaff;
  transform: scale(1.05);
}

@keyframes glow {
  from {
    box-shadow: 0 0 8px #a8dff1, 0 0 12px #c3f0ff;
  }
  to {
    box-shadow: 0 0 14px #00aaff, 0 0 18px #00ccff;
  }
}

  </style>
</head>
<body>
  <h1>Autism Symptom Checker</h1>
  <p>Please answer the following questions honestly to check for early signs of autism:</p>

  <form id="quizForm">
    <label for="name">Name:</label>
    <input type="text" id="name" required />

    <label for="age">Age:</label>
    <input type="number" id="age" required />

    <label>1. Do you avoid eye contact?</label>
    <select required>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label>2. Do you face difficulty in communication?</label>
    <select required>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label>3. Do you prefer routines and resist change?</label>
    <select required>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label>4. Do you have strong interests in specific topics?</label>
    <select required>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label>5. Do you react strongly to sounds, lights, or textures?</label>
    <select required>
      <option value="">Select</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <button type="submit">Submit</button>
  </form>
  <script>
    document.getElementById('quizForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const age = parseInt(document.getElementById('age').value);
      const answers = Array.from(document.querySelectorAll('select')).map(sel => sel.value);

      if (!name || !age || answers.includes('')) {
        alert("Please fill all fields.");
        return;
      }

      const score = answers.filter(ans => ans === 'yes').length;
      let autismType = "No significant signs";
      if (score >= 4) autismType = "Severe Autism";
      else if (score === 3) autismType = "Moderate Autism";
      else if (score === 2) autismType = "Mild Autism";

      const result = { name, age, score, autismType };

      fetch('/api/results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(result)
      })
        .then(res => {
          if (!res.ok) throw new Error('Network error');
          return res.json();
        })
        .then(data => {
          console.log("✅ Data saved:", data);
          localStorage.setItem("autismResult", JSON.stringify(result));
          window.location.href = "result.html";
        })
        .catch(err => {
          console.error("❌ Submit failed:", err);
          alert("Something went wrong. Please try again.");
        });
    });
  </script>
    <!--a href="index.html" class="back-btn">← Go Back to Home</a-->
<a href="guidance.html" class="guidance-btn">💬 Want Guidance?</a>

</body>
</html>
