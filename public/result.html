<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quiz Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #f0f8ff);
      color: #333;
      padding: 30px 20px;
      text-align: center;
    }

    header {
      background-color: #007acc;
      padding: 15px 0;
      margin-bottom: 40px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .navbar {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 0;
      margin: 0;
    }

    .navbar li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: color 0.3s ease;
    }

    .navbar li a:hover {
      color: #ffd54f;
    }

    h1 {
      font-size: 2.5rem;
      color: #004080;
      margin-bottom: 20px;
    }

    #resultBox {
      background-color: #ffffff;
      max-width: 700px;
      margin: 0 auto 30px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    #resultBox h2 {
      color: #007acc;
      margin-bottom: 20px;
    }

    #resultBox p {
      font-size: 18px;
      margin: 10px 0;
    }

    .info-section {
      text-align: left;
      margin-top: 30px;
    }

    .info-section h3 {
      color: #005f99;
      margin-top: 20px;
    }

    .info-section ul {
      list-style: disc;
      padding-left: 20px;
      margin: 10px 0;
    }

    .info-section a {
      color: #007acc;
      text-decoration: underline;
    }

    .btn {
      display: inline-block;
      background-color: #007acc;
      color: white;
      padding: 14px 28px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn:hover {
      background-color: #005f99;
      transform: scale(1.05);
    }

    .retake-float {
      position: fixed;
      top: 40%;
      right: 0;
      background-color: #ffc107;
      color: #003366;
      padding: 12px 16px;
      border-radius: 8px 0 0 8px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      z-index: 1000;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transition: background-color 0.3s ease;
    }

    .retake-float:hover {
      background-color: #e0a800;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }

      #resultBox {
        padding: 20px;
      }

      .btn {
        width: 100%;
        margin: 10px 0;
      }

      .info-section {
        text-align: left;
      }

      .retake-float {
        writing-mode: vertical-rl;
        top: auto;
        bottom: 100px;
        right: 10px;
        padding: 10px 14px;
        border-radius: 6px;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul class="navbar">
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>
  </header>

  <h1>Your Assessment Result</h1>

  <div id="resultBox"></div>

  <a href="guidance.html" class="btn">Get more Support & Resources</a>
  <a href="#" class="btn" onclick="window.print()">🖨️ Print Result</a>

  <!-- Floating retake test button -->
  <div class="retake-float" onclick="retakeQuiz()">🔁 </div>

  <script>
    const resultData = JSON.parse(localStorage.getItem('autismResult'));

    const dataMap = {
      "No significant signs": {
        tips: [
          "Continue practicing empathy and inclusion.",
          "Help spread awareness about autism in your community."
        ],
        therapies: ["None needed, but staying informed is always good."],
        resources: [
          { name: "Autism Speaks", link: "https://www.autismspeaks.org" }
        ],
        message: "You seem to be doing great! Stay supportive and informed 💙"
      },
      "Mild Autism": {
        tips: [
          "Maintain a structured daily routine.",
          "Practice communication through simple interactions.",
          "Use visual schedules or tools."
        ],
        therapies: ["Speech Therapy", "Occupational Therapy"],
        resources: [
          { name: "Autism Parenting Magazine", link: "https://www.autismparentingmagazine.com" },
          { name: "CDC - Autism Spectrum Disorder", link: "https://www.cdc.gov/ncbddd/autism/" }
        ],
        message: "With consistent support, progress is very achievable 🌱"
      },
      "Moderate Autism": {
        tips: [
          "Incorporate sensory-friendly environments.",
          "Reward positive behavior with praise or tokens.",
          "Use simple, clear communication."
        ],
        therapies: ["ABA Therapy", "Social Skills Training", "Behavioral Therapy"],
        resources: [
          { name: "Autism Navigator", link: "https://autismnavigator.com" },
          { name: "National Autistic Society", link: "https://www.autism.org.uk/" }
        ],
        message: "You’re not alone. Many improve significantly with regular therapy 💪"
      },
      "Severe Autism": {
        tips: [
          "Provide consistent structure and calm spaces.",
          "Use visual aids and sensory tools.",
          "Work with a specialized therapist regularly."
        ],
        therapies: ["Intensive Behavioral Intervention", "Physical Therapy", "Augmentative Communication Therapy"],
        resources: [
          { name: "Autism Society", link: "https://autismsociety.org/" },
          { name: "CARD - Center for Autism", link: "https://www.centerforautism.com/" }
        ],
        message: "Progress may take time, but it’s always possible. Keep going with hope ❤️"
      }
    };

    if (!resultData) {
      alert("Please take the quiz first!");
      window.location.href = "quiz.html";
    } else {
      const { name, age, score, autismType } = resultData;
      const data = dataMap[autismType] || {};

      let tipsHTML = data.tips?.map(tip => `<li>${tip}</li>`).join("") || "<li>No tips available.</li>";
      let therapiesHTML = data.therapies?.map(t => `<li>${t}</li>`).join("") || "<li>No therapies listed.</li>";
      let resourcesHTML = data.resources?.map(r => `<li><a href='${r.link}' target='_blank'>${r.name}</a></li>`).join("") || "<li>No resources listed.</li>";

      document.getElementById('resultBox').innerHTML = `
        <h2>Hello, ${name} 👋</h2>
        <p><strong>Age:</strong> ${age}</p>
        <p><strong>Your Score:</strong> ${score}/5</p>
        <p><strong>Possible Condition:</strong> ${autismType}</p>

        <div class="info-section">
          <h3>💡 Daily Tips:</h3>
          <ul>${tipsHTML}</ul>

          <h3>🧠 Recommended Therapies:</h3>
          <ul>${therapiesHTML}</ul>

          <h3>🔗 Trusted Resources:</h3>
          <ul>${resourcesHTML}</ul>

          <h3>💙 Encouragement:</h3>
          <p>${data.message}</p>
        </div>
      `;
    }

    function retakeQuiz() {
      if (confirm("Are you sure you want to retake the quiz?")) {
        localStorage.removeItem("autismResult");
        window.location.href = "quiz.html";
      }
    }
  </script>
</body>
</html>
