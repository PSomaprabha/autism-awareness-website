<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(to right, #c9d6ff, #e2e2e2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard-container {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 450px;
      width: 90%;
    }

    h1 {
      color: #004080;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      background: linear-gradient(to right, #007acc, #005f99);
      color: white;
      padding: 15px;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    @media (max-width: 500px) {
      .dashboard-container {
        padding: 30px 20px;
      }

      .btn {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
<div style="position: absolute; top: 32px; right: 32px; z-index: 10; display: flex; gap: 12px;">
    <a href="adminlogin.html" class="btn" style="background:linear-gradient(to right,#0055ff,#007acc); min-width:180px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">🔙 Back to Login Page</a>
  </div>
  <div class="dashboard-container">
    <h1>Welcome Admin 👩‍💻</h1>
    <p>What would you like to manage today?</p>

    <div class="btn-container">
      <a href="admin.html" class="btn">📄 View Quiz Results</a>
      <a href="adminMessages.html" class="btn">💬 View & Reply to Messages</a>
    </div>

  </div>

</body>
</html>
